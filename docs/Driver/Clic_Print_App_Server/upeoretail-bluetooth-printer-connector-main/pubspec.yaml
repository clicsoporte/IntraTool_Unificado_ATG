name: clic_soporte_print
description: "Clic Soporte Print — Aplicación móvil nativa para Clic-Tools con impresión térmica Bluetooth (58mm/80mm)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView host for the existing Next.js web app.
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0

  # Bluetooth CLASSIC (SPP) ESC/POS printing — works with P58E and similar.
  # NOT a BLE-only package, no RawBT, no third-party print app.
  print_bluetooth_thermal: ^1.1.4

  # ESC/POS byte generation (text styles, columns, QR, cut) for 58/80mm.
  esc_pos_utils_plus: ^2.0.4

  # Runtime permissions across Android 10–14+.
  permission_handler: ^11.3.1

  # Local storage for default printer + paper size + URL.
  shared_preferences: ^2.2.3

  # SQLite Embedded Database for persistent diagnostic logs.
  sqflite: ^2.3.2
  path: ^1.9.0

  # Camera and Photo selector for HTML5 file chooser inputs in WebView.
  image_picker: ^1.1.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
